[browser]
# Streamlit sends anonymous usage statistics by default
gatherUsageStats = false

[server]
# Largest file that can be uploaded, in MB (Streamlit's default is 200).
# Override with the STREAMLIT_SERVER_MAX_UPLOAD_SIZE environment variable.
maxUploadSize = 50
# Don't watch source files for changes. The watcher inspects every loaded module,
# and on transformers' lazy-loaded vision modules that logs ~100 "No module named
# 'torchvision'" errors per rerun. For auto-reload while developing, run:
#   streamlit run app.py --server.fileWatcherType auto
fileWatcherType = "none"
