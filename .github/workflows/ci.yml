name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      # sentence-transformers pulls in PyTorch; the CPU build avoids several GB of CUDA wheels
      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: privaterag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Compose files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.native-ollama.yml config --quiet
      # Catches dependencies missing from requirements.txt, which the health check can't see
      - name: Import the app's modules
        run: docker run --rm privaterag:ci python -c "import chat_store, ingest, rag, retrieval, vectorstore"
      - name: Start the app and wait for it to be healthy
        run: |
          docker run -d --name app -p 8501:8501 privaterag:ci
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8501/_stcore/health; then
              echo " after ${i}s"
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1
